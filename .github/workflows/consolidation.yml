name: Consolidation ORBITE - validation sans deploiement

on:
  push:
    branches:
      - consolidation-orbite
      - orb-q01-q02-questions-historiques
  pull_request:
    branches:
      - main
      - consolidation-orbite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lots-a-e:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ORBITE_DATA_DIR: ${{ github.workspace }}/.orbite-validation
      LOCALAPPDATA: ${{ github.workspace }}/.orbite-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
      - name: Verify original Excel template
        run: |
          python -c "from pathlib import Path; import hashlib; b=Path('backend/modele_consolide2.xlsx').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()=='0334213bf1b067c3f439c3b194ddc8e66511f761'"
      - name: Python historical regression tests
        run: python backend/run_validation.py --output validation/python-results.json
      - name: Question modules tests
        if: github.ref_name == 'orb-q01-q02-questions-historiques'
        working-directory: backend
        run: |
          python -m unittest test_orb_q01_q02 test_orb_q03 test_orb_q05 test_orb_q06_bridge test_orb_q02_history test_orb_q_dashboard_export -v
      - name: Electron preload contracts
        run: node --test electron/preload.test.cjs
      - name: Compile Python sidecar
        shell: pwsh
        run: |
          $args = @(
            '-m','PyInstaller','--noconfirm','--clean','--onefile',
            '--name','orbite_backend','--paths','backend','--distpath','backend/dist',
            '--hidden-import','openpyxl','--hidden-import','nps_analytics',
            '--hidden-import','question_analytics','--hidden-import','survey_library',
            '--hidden-import','ereputation_bridge','--hidden-import','engine',
            '--hidden-import','interactive_export','--hidden-import','google_view',
            '--hidden-import','export_guard','--hidden-import','periods'
          )
          if ('${{ github.ref_name }}' -eq 'orb-q01-q02-questions-historiques') {
            $args += @(
              '--hidden-import','orb_q01','--hidden-import','orb_q02',
              '--hidden-import','orb_q03','--hidden-import','orb_q05',
              '--hidden-import','orb_q06_bridge','--hidden-import','orb_q_history_store',
              '--hidden-import','orb_q_dashboard_export','--collect-all','reportlab'
            )
          }
          $args += 'backend/orbite_backend.py'
          & python @args
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Packaged backend smoke test
        run: python backend/smoke_sidecar.py backend/dist/orbite_backend.exe
      - name: Packaged A-E JSON IPC tests
        working-directory: backend
        env:
          ORBITE_TEST_EXECUTABLE: ${{ github.workspace }}/backend/dist/orbite_backend.exe
        run: python -m unittest test_consolidation_a_ipc test_consolidation_e -v
      - name: Install UI dependencies
        run: npm install
      - name: TypeScript and React production build
        run: npm run build
      - name: Package Electron without publishing
        run: npx electron-builder --win portable --publish never
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITE-validation-results
          path: validation/*.json
          if-no-files-found: warn
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ORBITE-recette-Windows
          path: release/*.exe
          if-no-files-found: error
