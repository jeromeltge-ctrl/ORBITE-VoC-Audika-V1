name: Consolidation ORBITE - validation sans deploiement

on:
  push:
    branches:
      - consolidation-orbite
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lots-a-e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'consolidation-orbite'
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ORBITE_DATA_DIR: ${{ github.workspace }}/.orbite-validation
      LOCALAPPDATA: ${{ github.workspace }}/.orbite-local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install existing Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify original Excel template is present and unchanged
        run: |
          python -c "from pathlib import Path; import hashlib; b=Path('backend/modele_consolide2.xlsx').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()=='0334213bf1b067c3f439c3b194ddc8e66511f761'"

      - name: Python tests including all historical regressions and template export
        run: python backend/run_validation.py --output validation/python-results.json

      - name: Electron preload contracts
        run: node --test electron/preload.test.cjs

      - name: Compile Python sidecar
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name orbite_backend --paths backend --distpath backend/dist --hidden-import openpyxl --hidden-import nps_analytics --hidden-import question_analytics --hidden-import survey_library --hidden-import ereputation_bridge --hidden-import engine --hidden-import interactive_export --hidden-import google_view --hidden-import export_guard --hidden-import periods backend/orbite_backend.py

      - name: Existing packaged backend smoke test
        run: python backend/smoke_sidecar.py backend/dist/orbite_backend.exe

      - name: Packaged lots A-E JSON IPC tests
        working-directory: backend
        env:
          ORBITE_TEST_EXECUTABLE: ${{ github.workspace }}/backend/dist/orbite_backend.exe
        run: python -m unittest test_consolidation_a_ipc test_consolidation_e -v

      - name: Install existing UI dependencies
        run: npm install

      - name: TypeScript and React production build
        run: npm run build

      - name: Package Electron without publishing
        run: npx electron-builder --win portable --publish never

      - name: Preserve test results even if a later build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITE-validation-results
          path: validation/*.json
          if-no-files-found: warn

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ORBITE-lots-A-E-recette-Windows
          path: release/*.exe
          if-no-files-found: error
